name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: test (node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22', '24']

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
              with:
                  node-version: ${{ matrix.node }}
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: |
                  if [ -f pnpm-lock.yaml ]; then
                    pnpm install --frozen-lockfile
                  else
                    pnpm install
                  fi
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm build
            - run: pnpm test

    coverage:
        name: coverage (node 22)
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
              with:
                  node-version: '22'
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: |
                  if [ -f pnpm-lock.yaml ]; then
                    pnpm install --frozen-lockfile
                  else
                    pnpm install
                  fi
            - run: pnpm build
            - run: pnpm test:coverage
            - uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage/

    prisma-matrix:
        name: prisma ${{ matrix.prisma }} (node 22)
        runs-on: ubuntu-latest
        needs: test
        strategy:
            fail-fast: false
            matrix:
                prisma: ['5', '6', '7']
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
              with:
                  node-version: '22'
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: |
                  if [ -f pnpm-lock.yaml ]; then
                    pnpm install --frozen-lockfile
                  else
                    pnpm install
                  fi
            - run: pnpm add -D prisma@^${{ matrix.prisma }} @prisma/generator-helper@^${{ matrix.prisma }}
            - run: pnpm build
            - run: pnpm test

    pack:
        name: pack + publish dry-run
        runs-on: ubuntu-latest
        needs: [test, prisma-matrix]
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
              with:
                  node-version: '22'
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: |
                  if [ -f pnpm-lock.yaml ]; then
                    pnpm install --frozen-lockfile
                  else
                    pnpm install
                  fi
            - run: pnpm build
            - run: pnpm publish --dry-run --no-git-checks
            - run: |
                  MAX_KB=400
                  SIZE_BYTES=$(stat -c %s dist/index.cjs)
                  SIZE_KB=$(( (SIZE_BYTES + 1023) / 1024 ))
                  echo "dist/index.cjs is ${SIZE_KB}KB (limit ${MAX_KB}KB)"
                  if [ "$SIZE_KB" -gt "$MAX_KB" ]; then
                      echo "::error::Bundle size ${SIZE_KB}KB exceeds limit ${MAX_KB}KB"
                      exit 1
                  fi

    # Prisma 8 is still in RC: this job tracks the pinned rc pair from
    # examples/prisma8-nestjs/package.json. Non-blocking until Prisma 8 GA, then it becomes required
    # (drop continue-on-error).
    prisma8-e2e:
        name: prisma 8 e2e (node ${{ matrix.node }})
        runs-on: ubuntu-latest
        needs: test
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                node: ['22', '24']
        env:
            PRISMA_DISABLE_TELEMETRY: '1'
            CHECKPOINT_DISABLE: '1'
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 10
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
              with:
                  node-version: ${{ matrix.node }}
            - uses: actions/setup-node@v6
              if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: |
                  if [ -f pnpm-lock.yaml ]; then
                    pnpm install --frozen-lockfile
                  else
                    pnpm install
                  fi
            - run: pnpm build

            # The example links the generator through `file:../..` (symlink under npm), so it
            # picks up the dist/ built above. The example lockfile is gitignored, hence no `npm ci`
            # unless one is present.
            - name: Install example dependencies
              working-directory: examples/prisma8-nestjs
              run: |
                  if [ -f package-lock.json ]; then
                    npm ci
                  else
                    npm install
                  fi
            - name: Emit contract
              working-directory: examples/prisma8-nestjs
              run: npm run emit
            - name: Generate DTOs
              working-directory: examples/prisma8-nestjs
              run: npm run generate
            - name: Typecheck example
              working-directory: examples/prisma8-nestjs
              run: npm run typecheck

    ci:
        name: ci
        runs-on: ubuntu-latest
        needs: [test, coverage, prisma-matrix, pack, prisma8-e2e]
        steps:
            - run: echo "All CI jobs passed"
